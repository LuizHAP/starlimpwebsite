<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Star Limp - Produtos de Limpeza - Atacado e Varejo">
  <title>Star Limp - Produtos de Limpeza</title>

  <!-- White background -->
  <rect x="0" y="0" width="720" height="280" fill="#FFFFFF"/>

  <!-- Soap bubbles (decorative, top right) -->
  <g opacity="0.9">
    <circle cx="565" cy="55" r="22" fill="none" stroke="#0098D8" stroke-width="2.5"/>
    <ellipse cx="558" cy="48" rx="6" ry="4" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="610" cy="32" r="14" fill="none" stroke="#0098D8" stroke-width="2"/>
    <ellipse cx="606" cy="27" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="640" cy="68" r="9" fill="none" stroke="#0098D8" stroke-width="1.5"/>
    <ellipse cx="638" cy="65" rx="2" ry="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Star icon (5-pointed, blue, slightly tilted) -->
  <g transform="translate(370, 100) rotate(-8)">
    <!-- Sparkle lines -->
    <g stroke="#0098D8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-95" x2="0" y2="-78"/>
      <line x1="68" y1="-68" x2="58" y2="-58"/>
      <line x1="-68" y1="-68" x2="-58" y2="-58"/>
      <line x1="85" y1="0" x2="72" y2="0"/>
    </g>
    <!-- Main star -->
    <path d="M 0,-65 L 19,-20 L 65,-15 L 30,15 L 40,60 L 0,35 L -40,60 L -30,15 L -65,-15 L -19,-20 Z"
          fill="#0098D8"/>
    <!-- Inner highlight -->
    <path d="M 0,-40 L 11,-12 L 38,-9 L 18,9 L 24,36 L 0,21 L -24,36 L -18,9 L -38,-9 L -11,-12 Z"
          fill="#5BC0EB" opacity="0.6"/>
    <circle cx="-14" cy="-24" r="3" fill="#FFFFFF"/>
  </g>

  <!-- "Star" - BLUE, italic bold -->
  <text x="60" y="135"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="110"
        font-weight="700"
        fill="#0098D8"
        font-style="italic">Star</text>

  <!-- "limp" - DARK, italic bold, LOWERCASE -->
  <text x="430" y="135"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="110"
        font-weight="700"
        fill="#2B2B2B"
        font-style="italic">limp</text>

  <!-- Subtitle -->
  <text x="360" y="172"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="15"
        font-weight="400"
        fill="#555555"
        text-anchor="middle"
        letter-spacing="3.5">PRODUTOS DE LIMPEZA</text>

  <!-- Tagline -->
  <text x="360" y="205"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="26"
        font-weight="700"
        fill="#1a1a1a"
        text-anchor="middle">Atacado &amp; Varejo</text>

  <!-- Wave -->
  <path d="M 0,260 Q 200,225 360,250 T 720,255 L 720,280 L 0,280 Z"
        fill="#0098D8"/>
  <path d="M 0,250 Q 200,215 360,240 T 720,245"
        fill="none" stroke="#3A3A3A" stroke-width="1.5" opacity="0.5"/>
</svg>
