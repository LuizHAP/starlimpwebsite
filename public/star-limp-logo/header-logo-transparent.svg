<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Star Limp - Produtos de Limpeza - Atacado e Varejo">
  <title>Star Limp - Produtos de Limpeza</title>

  <!-- Soap bubbles -->
  <g opacity="0.9">
    <circle cx="565" cy="55" r="22" fill="none" stroke="#0098D8" stroke-width="2.5"/>
    <circle cx="610" cy="32" r="14" fill="none" stroke="#0098D8" stroke-width="2"/>
    <circle cx="640" cy="68" r="9" fill="none" stroke="#0098D8" stroke-width="1.5"/>
  </g>

  <!-- Star icon -->
  <g transform="translate(370, 100) rotate(-8)">
    <g stroke="#0098D8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-95" x2="0" y2="-78"/>
      <line x1="68" y1="-68" x2="58" y2="-58"/>
      <line x1="-68" y1="-68" x2="-58" y2="-58"/>
      <line x1="85" y1="0" x2="72" y2="0"/>
    </g>
    <path d="M 0,-65 L 19,-20 L 65,-15 L 30,15 L 40,60 L 0,35 L -40,60 L -30,15 L -65,-15 L -19,-20 Z"
          fill="#0098D8"/>
    <path d="M 0,-40 L 11,-12 L 38,-9 L 18,9 L 24,36 L 0,21 L -24,36 L -18,9 L -38,-9 L -11,-12 Z"
          fill="#5BC0EB" opacity="0.6"/>
  </g>

  <text x="60" y="135"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="110"
        font-weight="700"
        fill="#0098D8"
        font-style="italic">Star</text>

  <text x="430" y="135"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="110"
        font-weight="700"
        fill="#2B2B2B"
        font-style="italic">limp</text>

  <text x="360" y="172"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="15"
        font-weight="400"
        fill="#555555"
        text-anchor="middle"
        letter-spacing="3.5">PRODUTOS DE LIMPEZA</text>

  <text x="360" y="205"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="26"
        font-weight="700"
        fill="#1a1a1a"
        text-anchor="middle">Atacado &amp; Varejo</text>
</svg>
