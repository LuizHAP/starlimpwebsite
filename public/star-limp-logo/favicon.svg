<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Star Limp icon">
  <title>Star Limp</title>

  <!-- White rounded square with subtle blue tint border vibe -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#FFFFFF"/>

  <!-- Subtle bubble in corner (decorative) -->
  <circle cx="430" cy="90" r="32" fill="none" stroke="#0098D8" stroke-width="6" opacity="0.5"/>
  <circle cx="465" cy="55" r="18" fill="none" stroke="#0098D8" stroke-width="4" opacity="0.4"/>

  <!-- Star centered, slightly tilted -->
  <g transform="translate(256, 270) rotate(-8) scale(2.3)">
    <!-- Sparkle lines -->
    <g stroke="#0098D8" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <line x1="0" y1="-95" x2="0" y2="-78"/>
      <line x1="68" y1="-68" x2="58" y2="-58"/>
      <line x1="-68" y1="-68" x2="-58" y2="-58"/>
      <line x1="85" y1="0" x2="72" y2="0"/>
    </g>
    <!-- Main star -->
    <path d="M 0,-65 L 19,-20 L 65,-15 L 30,15 L 40,60 L 0,35 L -40,60 L -30,15 L -65,-15 L -19,-20 Z"
          fill="#0098D8"/>
    <!-- Inner highlight -->
    <path d="M 0,-40 L 11,-12 L 38,-9 L 18,9 L 24,36 L 0,21 L -24,36 L -18,9 L -38,-9 L -11,-12 Z"
          fill="#5BC0EB" opacity="0.7"/>
    <!-- White sparkle dot -->
    <circle cx="-14" cy="-24" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Wave at the bottom -->
  <path d="M 0,460 Q 150,420 256,445 T 512,450 L 512,512 L 0,512 Z"
        fill="#0098D8"/>
</svg>
